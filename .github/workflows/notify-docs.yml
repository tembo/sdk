name: Update SDK documentation after release

on:
  workflow_run:
    workflows: [Release Please]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Published stable SDK version to send to docs
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: notify-sdk-docs
  cancel-in-progress: false

jobs:
  notify:
    if: github.repository == 'tembo/sdk' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || ((github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check publication succeeded
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[] | select(.name == "publish" and .conclusion == "success") | .id' | grep -q .; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve published stable version
        if: steps.published.outputs.ready == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_SHA" ]; then
            VERSION=$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$RELEASE_SHA" --jq '.content' | base64 -d | jq -er '.version')
          else
            VERSION="$REQUESTED_VERSION"
          fi
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" | jq -e '.draft == false and .prerelease == false' > /dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        if: steps.published.outputs.ready == 'true'
        id: bot
        with:
          app-id: ${{ vars.CI_PUBLIC_BOT_APP_ID }}
          private-key: ${{ secrets.CI_PUBLIC_BOT_PRIVATE_KEY }}
          owner: tembo
          repositories: docs
          permission-contents: write
      - name: Request documentation update
        if: steps.published.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          SDK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq -n --arg version "$SDK_VERSION" '{event_type:"sdk-published",client_payload:{version:$version}}' |
            gh api --method POST repos/tembo/docs/dispatches --input -
