name: Notify engineering of SDK release PR

on:
  pull_request_target:
    types: [opened]
    branches: [main]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release-please--branches--scalar-next--components--sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mention SDK reviewer in engineering
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ENGINEERING_WEBHOOK_URL }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo '::error::Set SLACK_ENGINEERING_WEBHOOK_URL to an incoming webhook for #engineering.'
            exit 1
          fi
          jq -n --arg url "$PR_URL" \
            '{text: ("<@U0A6ULQ6KMY> New SDK release PR ready for review: <" + $url + "|Review PR>")}' \
            > "$RUNNER_TEMP/slack-message.json"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/slack-message.json" "$SLACK_WEBHOOK_URL"
